# ECUlytics Enterprise Production Nginx Configuration
# Containerized inter-service DNS routing
upstream backend_api {
    server backend:3001;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name eculytics.vgmarine.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eculytics.vgmarine.com;

    ssl_certificate /etc/ssl/certs/eculytics.crt;
    ssl_certificate_key /etc/ssl/private/eculytics.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy 'accelerometer=(self "https://*.razorpay.com" "https://*.sentry-cdn.com"), gyroscope=(self "https://*.razorpay.com" "https://*.sentry-cdn.com"), magnetometer=(self "https://*.razorpay.com" "https://*.sentry-cdn.com")' always;
    add_header Access-Control-Expose-Headers "X-Request-Id, request-id, x-rtb-fingerprint-id, Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://api.razorpay.com https://*.sentry-cdn.com; connect-src 'self' https: wss: https://api.razorpay.com https://lumberjack.razorpay.com https://*.sentry.io; img-src 'self' https: data: blob:; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com;" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API Gateway Routing
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://backend_api/health;
        access_log off;
    }

    # Next.js Web Application Routing
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
